@if (dog(); as d) {
  <article class="detail" appHighlight>
    <h2>{{ d.country | uppercase}}</h2>
    <p>Breed: {{ d.breed }}</p>
    <p>Fur Type: {{ d.furType | furLabel | titlecase }}</p>
    @if (d.isHypoallergenic) {
      <p>This is a hypoallergenic breed</p>
    } @else {
      <p>This is not a hypoallergenic breed</p>
    }

    <button type="button" class="favourite-button" (click)="saved.toggle(d.id)">
      {{ saved.isSaved(d.id) ? 'Unsave' : 'Save' }}
    </button>
  </article>
  <div class="actions">
    <a [routerLink]="['/edit', d.id]">Edit</a>
    <button type="button" class="delete-button" [appConfirm]="'Delete '+ d.breed + '?'" (confirmed)="onDelete(d.id)">Delete</button>
  </div>

  <a routerLink="/dogs">Back to dog list</a>
}
