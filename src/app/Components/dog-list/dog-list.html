
  @for (dog of dogList(); track dog.id) {
    <app-dog-card
    [dog]="dog"
    (opened)="onDogOpened($event)"
    >

    </app-dog-card>
  } @empty {
    <p>No dogs have been loaded</p>
  }
  <h2>Hypoallergenic Dog Breeds!</h2>
  @for (dog of dogService.dogsWithHypoallergenic(); track dog.id){
    <app-dog-card [dog] = "dog"></app-dog-card>
  } @empty {
    <p>No Hypoallergenic Dogs</p>
  }
  <p>Number of hypoallergenic dogs: {{dogService.numberOfHypoDogs()}}</p>
